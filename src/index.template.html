}
@media (prefers-color-scheme: dark){

}

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;text-decoration:none}
.mark{position:relative;display:inline-block;width:28px;height:28px;border-radius:8px;background:var(--ink)}
.mark i,.mark b{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.mark i{left:5px}.mark b{left:11px;border-color:var(--bg)}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--card)}
main{padding:40px 0 56px;min-height:60vh}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,54px)}
h2{font-size:clamp(28px,4.4vw,38px)}
h3{font-size:20px}
.lead{font-size:19px;max-width:640px;margin:18px 0 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr;gap:28px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:0 0 14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
label.lbl,.lbl{display:block;font-weight:600;margin:28px 0 8px}
.lbl .muted{font-weight:400}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
textarea:focus,input[type=text]:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:130px;resize:vertical}
textarea.ans{min-height:72px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:inherit;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.lensgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.lensgrid{grid-template-columns:1fr}}
.lens{font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;cursor:pointer;color:var(--ink);position:relative;line-height:1.35}
.lens b{display:block;font-size:16px}
.lens span{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.lens::before{content:"";position:absolute;left:14px;top:15px;width:16px;height:16px;border-radius:5px;border:2px solid var(--line);background:var(--field)}
.lens[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.lens[aria-pressed="true"]::before{background:var(--c);border-color:var(--c);box-shadow:inset 0 0 0 3px var(--field)}
.lens:hover{border-color:var(--c)}
.linkrow{display:flex;gap:14px;margin-top:10px;font-size:14px}
.linkbtn{font:inherit;font-size:14px;background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:12px 20px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.link{background:none;border:none;padding:12px 4px;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.chip:focus-visible,.lens:focus-visible,.tab:focus-visible,.langs button:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{border-left:3px solid var(--accent);background:var(--card);padding:14px 18px;border-radius:0 10px 10px 0;font-size:15px}
.warn{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:0 10px 10px 0;font-size:15px;margin-top:12px}
.warn.crisis{border-left-color:var(--accent);background:var(--accent-soft)}
.warn b{display:block;margin-bottom:2px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.tab{font:inherit;font-size:14px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--ink);background:var(--card)}
.tab.done{color:var(--ink)}
.kicker{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:8px}
.kicker i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sit{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;font-size:15px;white-space:pre-wrap}
.sit b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;white-space:normal}
section.part{margin-top:34px}
section.part>h3{margin-bottom:14px}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.idea b{display:block;margin-bottom:4px}
.idea p{margin:0;font-size:15px;color:var(--ink)}
.reading{font-family:var(--serif);font-size:20px;line-height:1.5;max-width:760px;margin:0;border-left:3px solid var(--c);padding-left:18px}
.qa{margin:0 0 18px}
.qa label{display:block;font-weight:600;margin-bottom:8px}
.qa label span{color:var(--c);margin-right:6px}
ul.lim{margin:0;padding-left:22px}
ul.lim li{margin-bottom:8px}
.src{font-size:14px;color:var(--muted);margin:0;padding-left:20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.sum{margin-top:24px}
.sum .l{margin-bottom:18px}
.sum .l h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.sum .l h4 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sum .l p{margin:0 0 6px;font-size:15px}
.sum .l p em{color:var(--muted);font-style:normal}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:36px 0 48px;font-size:15px;color:var(--muted)}
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:820px){footer .cols{grid-template-columns:1fr}}
footer h3{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);margin-bottom:8px}
footer p{margin:0 0 10px}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
details p{max-width:720px}
@media print{
  header.top,.actions,.langs,.tabs,.navrow,footer .cols>div:nth-child(3),.btn,.chips{display:none!important}
  body{background:#fff;color:#000}
}
</style>

/* ---------- safety checks (local only) ---------- */
const CHECKS = {
  label: /(нарцисс|токсичн|психопат|социопат|газлайт|созависим|пограничн|биполяр|шизоид|манипулятор|энергетическ\p{L}* вампир|narcissis|toxic|psychopath|sociopath|gaslight|codependen|borderline|bipolar|manipulator|energy vampire)\p{L}*/giu,
  safe: /(бь[её]т|ударил|избил|душил|толкнул|угрожа|боюсь (его|её|ее)|насили|абьюз|запрещает (мне )?(общаться|выходить|видеться)|забирает (мой )?телефон|hits me|hit me|beats? me|beat me|chok(e|ed|es|ing) me|strangl|pushed me|threaten|afraid of (him|her)|violen|abus|won'?t let me (see|go|leave)|takes my phone)/iu,
  crisis: /(суицид|покончить с собой|убить себя|не хочу жить|не хочется жить|навредить себе|самоповрежд|режу себя|порезать себя|suicid|kill myself|end my life|self[- ]harm|hurt myself|don'?t want to live|want to die|cut myself)/iu
};
function scan(text){
  const s = String(text || "");
  const labels = [...new Set((s.match(CHECKS.label) || []).map(w => w.toLowerCase()))].slice(0, 3);
  return { labels, safe: CHECKS.safe.test(s), crisis: CHECKS.crisis.test(s) };
}

/* ---------- state ---------- */
const blank = () => ({ situation: "", selected: LENSES.map(l => l.id).slice(0, 4), view: "start", answers: {}, takeaway: "", step: "" });
let S = blank();
let lang = "ru";

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} },
  del(){ try { localStorage.removeItem(KEY); } catch(e){} }
};
const save = () => store.set({ ...S, lang });

function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ru" || q === "en") return q;
  const saved = store.get();
  if (saved && (saved.lang === "ru" || saved.lang === "en")) return saved.lang;
  const nav = (navigator.languages || [navigator.language || "en"]).join(",").toLowerCase();
  return /(^|,)(ru|uk|be|kk)/.test(nav) ? "ru" : "en";
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const t = () => T[lang];
const sel = () => S.selected.filter(id => byId[id]);
const ans = (id) => (S.answers[id] = S.answers[id] || ["", "", "", ""]);
const pcUrl = (medium) => (lang === "ru" ? "https://pairclear.com/ru/" : "https://pairclear.com/en/") + "?utm_source=github&utm_medium=" + medium + "&utm_campaign=" + CAMPAIGN;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove();
  }
  toast(t().copied);
}

function warnings(text){
  const L = t(), r = scan(text);
  let h = "";
  if (r.crisis) h += `<div class="warn crisis" role="alert"><b>${esc(L.w_crisis_h)}</b>${L.w_crisis}</div>`;
  if (r.safe) h += `<div class="warn crisis"><b>${esc(L.w_safe_h)}</b>${L.w_safe}</div>`;
  if (r.labels.length) h += `<div class="warn"><b>${esc(L.w_label_h)}</b>${esc(L.w_label(r.labels.map(w => (lang === "ru" ? "«" + w + "»" : "\u201c" + w + "\u201d")).join(", ")))}</div>`;
  return h;
}

function asMarkdown(){
  const L = t();
  const out = ["# " + L.md_title, ""];
  if (S.situation.trim()) out.push("## " + L.sit_k, "", S.situation.trim(), "");
  sel().forEach(id => {
    const x = byId[id][lang], a = S.answers[id] || [];
    out.push("## " + x.name, "");
    x.questions.forEach((q, k) => out.push("**" + q + "**", "", (a[k] && a[k].trim()) || "—", ""));
  });
  if (S.takeaway.trim()) out.push("## " + L.take_l, "", S.takeaway.trim(), "");
  if (S.step.trim()) out.push("## " + L.step_l, "", S.step.trim(), "");
  out.push("---", L.md_note);
  return out.join("\n");
}

/* ---------- render ---------- */
function render(focus){
  const app = $("#app");
  const v = S.view;
  app.innerHTML = v === "start" ? viewStart() : v === "summary" ? viewSummary() : byId[v] ? viewLens(v) : viewStart();
  if (focus) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  save();
}

function go(v){
  if (v !== "start" && v !== "summary" && !byId[v]) v = "start";
  S.view = v; render(true);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const lb = e.target.closest(".langs button");
  if (lb){ lang = lb.dataset.lang; applyStatic(); render(); return; }
  if (e.target.closest("#home")){ e.preventDefault(); go("start"); return; }
  const g = e.target.closest("[data-go]");
  if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const ex = e.target.closest("[data-ex]");
  if (ex){ S.situation = t().examples[+ex.dataset.ex][1]; render(); return; }
  const ln = e.target.closest("[data-lens]");
  if (ln){
    const id = ln.dataset.lens;
    S.selected = S.selected.includes(id) ? S.selected.filter(x => x !== id) : LENSES.map(l => l.id).filter(x => x === id || S.selected.includes(x));
    ln.setAttribute("aria-pressed", String(S.selected.includes(id)));
    $("#goBtn").disabled = !sel().length; $("#pickMsg").textContent = sel().length ? "" : t().pick_one;
    save(); return;
  }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, L = t();
  if (act === "all"){ S.selected = LENSES.map(l => l.id); render(); }
  else if (act === "none"){ S.selected = []; render(); }
  else if (act === "resume"){ go(sel()[0] || "start"); }
  else if (act === "discard" || act === "new"){ const keep = S.selected; S = blank(); S.selected = keep; go("start"); }
  else if (act === "copyLens"){ copy(CORE.lensPrompt(byId[S.view], lang, { situation: S.situation, answers: S.answers })); }
  else if (act === "copyAll"){ copy(CORE.multiPrompt(sel().map(id => byId[id]), lang, { situation: S.situation, answers: S.answers })); }
  else if (act === "copyText"){ copy(asMarkdown()); }
  else if (act === "md"){
    const blob = new Blob([asMarkdown()], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (lang === "ru" ? "linzy-" : "lenses-") + new Date().toISOString().slice(0, 10) + ".md";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(L.downloaded);
  }
  else if (act === "clear"){ if (confirm(L.clear_q)){ store.del(); S = blank(); go("start"); toast(L.cleared); } }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "sit"){ S.situation = el.value; $("#warn").innerHTML = warnings(el.value); save(); }
  else if (el.dataset.a !== undefined && byId[S.view]){ ans(S.view)[+el.dataset.a] = el.value; save(); }
  else if (el.id === "take"){ S.takeaway = el.value; save(); }
  else if (el.id === "stepf"){ S.step = el.value; save(); }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "startForm"){ e.preventDefault(); if (sel().length) go(sel()[0]); }
});
